# Grant Perses SA read access to application logs via LokiStack gateway.
# COO deploys Perses to openshift-operators with perses-sa.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: perses-loki-application-view
  labels:
    app.kubernetes.io/managed-by: maas-observability
    app.kubernetes.io/component: perses
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-logging-application-view
subjects:
  - kind: ServiceAccount
    name: perses-sa
    namespace: openshift-operators
