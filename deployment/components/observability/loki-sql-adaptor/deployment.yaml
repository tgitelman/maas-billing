apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-sql-adaptor
  labels:
    app: loki-sql-adaptor
    app.kubernetes.io/part-of: maas-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-sql-adaptor
  template:
    metadata:
      labels:
        app: loki-sql-adaptor
    spec:
      containers:
      - name: loki-sql-adaptor
        image: loki-sql-adaptor:latest
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: MYSQL_DSN
          valueFrom:
            secretKeyRef:
              name: loki-sql-adaptor-db
              key: dsn
        - name: LISTEN_ADDR
          value: ":8080"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
