---
apiVersion: perses.dev/v1alpha1
kind: PersesDatasource
metadata:
  name: loki
  namespace: opendatahub
  labels:
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: perses
spec:
  config:
    display:
      name: "Usage Logs - admin"
    default: false
    plugin:
      kind: "LokiDatasource"
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: 'https://maas-loki-gateway-http.opendatahub.svc.cluster.local:8080/api/logs/v1/application'
            allowedEndpoints:
              - endpointPattern: "/loki/api/v1/.*"
                method: GET
            secret: loki-secret
  client:
    kubernetesAuth:
      enable: true
    tls:
      enable: true
      insecureSkipVerify: false
      caCert:
        type: configmap
        name: maas-loki-gateway-ca-bundle
        certPath: service-ca.crt
